name: Golden images

# Software GPU (SwiftShader) on hosted runners for every relevant pull request; a real GPU on demand
# through a self-hosted runner labelled `gpu` (docs/adr/0012-tooling-and-ci.md).
on:
  pull_request:
    paths: ['src/**', 'tests/golden/**', 'tools/**', 'package-lock.json']
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label: ubuntu-latest (SwiftShader) or gpu (self-hosted, hardware adapter)'
        default: ubuntu-latest
      update_hashes:
        description: 'Write tests/golden/engine-hashes.json from this runner and upload it (the hashes are bytes, so they must come from the runner that checks them)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  golden:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - if: ${{ !inputs.update_hashes }}
        run: npm run golden
      - if: ${{ inputs.update_hashes }}
        continue-on-error: true
        run: npm run golden -- --update-engine
      - if: ${{ inputs.update_hashes }}
        uses: actions/upload-artifact@v5
        with:
          name: engine-hashes
          path: tests/golden/engine-hashes.json
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: golden-diff
          path: tests/golden/diff/
          if-no-files-found: ignore
